name: Build WOW Editor V5 Full Renderer

on:
  workflow_dispatch:
  push:
    branches:
      - wow-cloud-hat-extension

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout WOW Editor
        uses: actions/checkout@v4

      - name: Configure x64 Release
        shell: pwsh
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build WOW Editor
        shell: pwsh
        run: cmake --build build --config Release --parallel

      - name: Get pinned RE+ capture bridge source
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force _deps | Out-Null
          git clone --filter=blob:none https://github.com/crxhvrd/simplecamera.git _deps/simplecamera
          git -C _deps/simplecamera checkout 13c92ef2565403ffcc2501f779ca7cd935e5d598

      - name: Build IgcsConnector x64 Release
        shell: pwsh
        run: |
          $sln = "_deps/simplecamera/external/IgcsConnector-main/src/IgcsConnector.sln"
          if (!(Test-Path $sln)) { throw "IgcsConnector solution not found: $sln" }

          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (!(Test-Path $vswhere)) { throw "vswhere.exe not found" }

          $msbuild = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -find "MSBuild\**\Bin\MSBuild.exe" | Select-Object -First 1
          if (!$msbuild) { throw "MSBuild.exe not found by vswhere" }

          Write-Host "Using MSBuild: $msbuild"
          & $msbuild $sln /m /p:Configuration=Release /p:Platform=x64
          if ($LASTEXITCODE -ne 0) { throw "IgcsConnector build failed with exit code $LASTEXITCODE" }

          $addon = Get-ChildItem "_deps/simplecamera" -Recurse -Filter "IgcsConnector.addon64" | Select-Object -First 1
          if (!$addon) { throw "IgcsConnector.addon64 was not produced" }
          Write-Host "Capture bridge: $($addon.FullName)"

      - name: Download static FFmpeg 8.1
        shell: pwsh
        run: |
          $url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n8.1-latest-win64-gpl-8.1.zip"
          Invoke-WebRequest -Uri $url -OutFile "_deps/ffmpeg.zip"
          Expand-Archive "_deps/ffmpeg.zip" -DestinationPath "_deps/ffmpeg" -Force
          $ffmpeg = Get-ChildItem "_deps/ffmpeg" -Recurse -Filter "ffmpeg.exe" | Select-Object -First 1
          if (!$ffmpeg) { throw "ffmpeg.exe not found in downloaded archive" }
          Write-Host "FFmpeg: $($ffmpeg.FullName)"

      - name: Collect complete V5.3 FiveM package
        shell: pwsh
        run: |
          $root      = "artifact"
          $plugins   = Join-Path $root "FiveM.app/plugins"
          $repBase   = Join-Path $plugins "RockstarEditorPlus"
          $shaderDir = Join-Path $plugins "reshade-shaders/Shaders"
          $defaults  = Join-Path $root "OPTIONAL_DEFAULT_CONFIG"

          New-Item -ItemType Directory -Force $plugins,$repBase,$shaderDir,$defaults | Out-Null

          # FiveM loads ASI plugins from FiveM.app\plugins.
          Copy-Item "build/BIN/Release/RockstarEditorPlus.asi" $plugins

          # The RE+ capture bridge must be visible to the ReShade instance used
          # by FiveM, so package it in FiveM.app\plugins beside ReShade/dxgi.dll.
          $addon = Get-ChildItem "_deps/simplecamera" -Recurse -Filter "IgcsConnector.addon64" | Select-Object -First 1
          Copy-Item $addon.FullName (Join-Path $plugins "IgcsConnector.addon64")

          # ReShade shader path for the FiveM plugin layout.
          Copy-Item "_deps/simplecamera/external/IgcsConnector-main/src/Shader/IgcsDof.fx" (Join-Path $shaderDir "IgcsDof.fx")

          # ffmpeg is resolved from RockstarEditorPlus\ beside the ASI.
          $ffmpeg = Get-ChildItem "_deps/ffmpeg" -Recurse -Filter "ffmpeg.exe" | Select-Object -First 1
          Copy-Item $ffmpeg.FullName (Join-Path $repBase "ffmpeg.exe")

          if (Test-Path "build/BIN/Release/RE+ Render Settings.exe") {
            Copy-Item "build/BIN/Release/RE+ Render Settings.exe" $repBase
          }

          # Do not overwrite an existing user's V4/V5 settings automatically.
          if (Test-Path "build/BIN/Release/RockstarEditorPlus.ini") {
            Copy-Item "build/BIN/Release/RockstarEditorPlus.ini" $defaults
          }
          if (Test-Path "build/BIN/Release/Render.ini") {
            Copy-Item "build/BIN/Release/Render.ini" $defaults
          }
          if (Test-Path "build/BIN/Release/Lights.ini") {
            Copy-Item "build/BIN/Release/Lights.ini" $defaults
          }

          $install = @(
            "WOW EDITOR V5.3 - FIVEM RESHADE LAYOUT FIX",
            "===========================================",
            "",
            "V5.3 keeps V4/V3 behavior unchanged and only corrects the FiveM packaging layout.",
            "",
            "INSTALL",
            "-------",
            "1. Close FiveM.",
            "",
            "2. Copy the CONTENTS of:",
            "     FiveM.app\plugins\",
            "   into:",
            "     %LOCALAPPDATA%\FiveM\FiveM.app\plugins\",
            "",
            "   This installs:",
            "     RockstarEditorPlus.asi",
            "     IgcsConnector.addon64",
            "     RockstarEditorPlus\ffmpeg.exe",
            "     reshade-shaders\Shaders\IgcsDof.fx",
            "",
            "3. Install ReShade WITH FULL ADD-ON SUPPORT.",
            "   FiveM needs the ReShade runtime used for FiveM inside:",
            "     %LOCALAPPDATA%\FiveM\FiveM.app\plugins\",
            "",
            "   In practice the ReShade runtime is usually dxgi.dll.",
            "   If your ReShade installer placed dxgi.dll in the GTA V game root,",
            "   copy that dxgi.dll into FiveM.app\plugins as well.",
            "",
            "4. Do NOT delete your existing RockstarEditorPlus INIs/settings.",
            "   OPTIONAL_DEFAULT_CONFIG contains fresh defaults only for clean install/recovery.",
            "",
            "ONE TEST",
            "--------",
            "Wow Editor      On",
            "Output          Video (.mov)",
            "Encoder Preset  prores_hq",
            "Frame Rate      60 fps",
            "",
            "Expected custom-render result:",
            "  MOV / Apple ProRes 422 HQ",
            "",
            "If you still get MP4 / H.264, ReShade or IgcsConnector is not presenting to WOW Editor.",
            "",
            "Typical custom-render output:",
            "  %LOCALAPPDATA%\FiveM\FiveM.app\plugins\RockstarEditorPlus\Captures\"
          )
          $install | Set-Content -Path (Join-Path $root "INSTALL_V5.3.txt") -Encoding UTF8

          if (Test-Path "WOW_CLOUD_HAT_NOTES.md") {
            Copy-Item "WOW_CLOUD_HAT_NOTES.md" $root
          }

      - name: Verify V5.3 package contents
        shell: pwsh
        run: |
          $required = @(
            "artifact/FiveM.app/plugins/RockstarEditorPlus.asi",
            "artifact/FiveM.app/plugins/IgcsConnector.addon64",
            "artifact/FiveM.app/plugins/RockstarEditorPlus/ffmpeg.exe",
            "artifact/FiveM.app/plugins/reshade-shaders/Shaders/IgcsDof.fx",
            "artifact/INSTALL_V5.3.txt"
          )
          foreach ($p in $required) {
            if (!(Test-Path $p)) { throw "V5.3 package missing required file: $p" }
            Write-Host "OK $p"
          }

      - name: Upload V5.3 artifact
        uses: actions/upload-artifact@v4
        with:
          name: WOW-Editor-V5.3-FiveM-Renderer
          path: artifact
          compression-level: 6

name: Build WOW Editor V5 Full Renderer

on:
  workflow_dispatch:
  push:
    branches:
      - wow-cloud-hat-extension

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout WOW Editor
        uses: actions/checkout@v4

      - name: Configure x64 Release
        shell: pwsh
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build WOW Editor
        shell: pwsh
        run: cmake --build build --config Release --parallel

      - name: Get pinned RE+ capture bridge source
        shell: pwsh
        run: |
          git clone --filter=blob:none https://github.com/crxhvrd/simplecamera.git _deps/simplecamera
          git -C _deps/simplecamera checkout 13c92ef2565403ffcc2501f779ca7cd935e5d598

      - name: Build IgcsConnector x64 Release
        shell: pwsh
        run: |
          $sln = "_deps/simplecamera/external/IgcsConnector-main/src/IgcsConnector.sln"
          if (!(Test-Path $sln)) { throw "IgcsConnector solution not found: $sln" }
          & msbuild $sln /m /p:Configuration=Release /p:Platform=x64
          if ($LASTEXITCODE -ne 0) { throw "IgcsConnector build failed with exit code $LASTEXITCODE" }
          $addon = Get-ChildItem "_deps/simplecamera" -Recurse -Filter "IgcsConnector.addon64" | Select-Object -First 1
          if (!$addon) { throw "IgcsConnector.addon64 was not produced" }
          Write-Host "Capture bridge: $($addon.FullName)"

      - name: Download static FFmpeg 8.1
        shell: pwsh
        run: |
          $url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n8.1-latest-win64-gpl-8.1.zip"
          Invoke-WebRequest -Uri $url -OutFile "_deps/ffmpeg.zip"
          Expand-Archive "_deps/ffmpeg.zip" -DestinationPath "_deps/ffmpeg" -Force
          $ffmpeg = Get-ChildItem "_deps/ffmpeg" -Recurse -Filter "ffmpeg.exe" | Select-Object -First 1
          if (!$ffmpeg) { throw "ffmpeg.exe not found in downloaded archive" }
          Write-Host "FFmpeg: $($ffmpeg.FullName)"

      - name: Collect complete V5 package
        shell: pwsh
        run: |
          $root       = "artifact"
          $plugins    = Join-Path $root "FiveM.app/plugins"
          $repBase    = Join-Path $plugins "RockstarEditorPlus"
          $gtaRoot    = Join-Path $root "GTA_V_GAME_ROOT"
          $shaderDir  = Join-Path $gtaRoot "reshade-shaders/Shaders"
          $defaults   = Join-Path $root "OPTIONAL_DEFAULT_CONFIG"

          New-Item -ItemType Directory -Force $plugins,$repBase,$gtaRoot,$shaderDir,$defaults | Out-Null

          Copy-Item "build/BIN/Release/RockstarEditorPlus.asi" $plugins

          $ffmpeg = Get-ChildItem "_deps/ffmpeg" -Recurse -Filter "ffmpeg.exe" | Select-Object -First 1
          Copy-Item $ffmpeg.FullName (Join-Path $repBase "ffmpeg.exe")
          if (Test-Path "build/BIN/Release/RE+ Render Settings.exe") {
            Copy-Item "build/BIN/Release/RE+ Render Settings.exe" $repBase
          }

          if (Test-Path "build/BIN/Release/RockstarEditorPlus.ini") { Copy-Item "build/BIN/Release/RockstarEditorPlus.ini" $defaults }
          if (Test-Path "build/BIN/Release/Render.ini")             { Copy-Item "build/BIN/Release/Render.ini" $defaults }
          if (Test-Path "build/BIN/Release/Lights.ini")             { Copy-Item "build/BIN/Release/Lights.ini" $defaults }

          $addon = Get-ChildItem "_deps/simplecamera" -Recurse -Filter "IgcsConnector.addon64" | Select-Object -First 1
          Copy-Item $addon.FullName (Join-Path $gtaRoot "IgcsConnector.addon64")
          Copy-Item "_deps/simplecamera/external/IgcsConnector-main/src/Shader/IgcsDof.fx" (Join-Path $shaderDir "IgcsDof.fx")

          @'
WOW EDITOR V5 - FULL CUSTOM RENDERER
====================================

V5 keeps the proven V4/V3 systems and adds the renderer dependencies missing
from the previous minimal artifact.

FIVEM INSTALL
-------------
1. Close FiveM.
2. Copy the CONTENTS of:
     FiveM.app\plugins\
   into:
     %LOCALAPPDATA%\FiveM\FiveM.app\plugins\
   Replace RockstarEditorPlus.asi.

3. Copy the CONTENTS of:
     GTA_V_GAME_ROOT\
   into the real GTA V folder containing GTA5.exe and ReShade.

4. ReShade is NOT bundled. It must be installed WITH FULL ADD-ON SUPPORT.

5. Existing V4 users should keep their current INIs/settings. Fresh defaults are
   in OPTIONAL_DEFAULT_CONFIG only for recovery/clean install.

ONE VERIFICATION
----------------
In Wow Editor Export choose:
  Wow Editor     On
  Output         Video (.mov)
  Encoder Preset prores_hq
  Frame Rate     60 fps

A working custom renderer produces MOV / Apple ProRes 422 HQ.
If the result is MP4 / H.264, Rockstar's exporter still ran.

Typical output:
  %LOCALAPPDATA%\FiveM\FiveM.app\plugins\RockstarEditorPlus\Captures\
'@ | Set-Content -Path (Join-Path $root "INSTALL_V5.txt") -Encoding UTF8

          if (Test-Path "WOW_CLOUD_HAT_NOTES.md") { Copy-Item "WOW_CLOUD_HAT_NOTES.md" $root }

      - name: Verify V5 package contents
        shell: pwsh
        run: |
          $required = @(
            "artifact/FiveM.app/plugins/RockstarEditorPlus.asi",
            "artifact/FiveM.app/plugins/RockstarEditorPlus/ffmpeg.exe",
            "artifact/GTA_V_GAME_ROOT/IgcsConnector.addon64",
            "artifact/GTA_V_GAME_ROOT/reshade-shaders/Shaders/IgcsDof.fx",
            "artifact/INSTALL_V5.txt"
          )
          foreach ($p in $required) {
            if (!(Test-Path $p)) { throw "V5 package missing required file: $p" }
            Write-Host "OK $p"
          }

      - name: Upload V5 artifact
        uses: actions/upload-artifact@v4
        with:
          name: WOW-Editor-V5-Full-Renderer
          path: artifact
          compression-level: 6
